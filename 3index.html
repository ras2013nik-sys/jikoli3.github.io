<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jikoli Factory</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:15px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

.tabs{
    display:flex;
    background:#1e293b;
}

.tabs button{
    flex:1;
    padding:15px;
    border:none;
    background:#1e293b;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.tabs button:hover{
    background:#334155;
}

.page{
    display:none;
    padding:15px;
}

.active{
    display:block;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.mainBall{
    width:170px;
    height:170px;
    border-radius:50%;
    background:linear-gradient(145deg,#22c55e,#16a34a);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    margin:auto;
    cursor:pointer;
    user-select:none;
}

.mainBall:active{
    transform:scale(0.92);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.sell{background:#f59e0b;}
.upg{background:#3b82f6;}
.pass{background:#a855f7;}

.quest{
    background:#334155;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
}

.quest button{
    background:#22c55e;
    margin-top:5px;
}

.bar{
    height:20px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#a855f7,#ec4899);
}

.passItem{
    background:#334155;
    padding:10px;
    border-radius:10px;
    margin-top:8px;
}

.done{
    background:#22c55e !important;
}
</style>
</head>
<body>

<header>Jikoli Factory</header>

<div class="tabs">
<button onclick="openTab('factory')">Фабрика</button>
<button onclick="openTab('quests')">Квесты</button>
<button onclick="openTab('pass')">Pass</button>
</div>

<!-- ФАБРИКА -->
<div id="factory" class="page active">
<div class="card">

<h2>Фабрика</h2>

<div class="mainBall" onclick="makeBall()">JIKOLI</div>

<p>Шарики: <span id="balls">0</span></p>
<p>Монеты: <span id="coins">0</span></p>
<p>Конвейеры: <span id="machines">0</span></p>

<button class="sell" onclick="sellBalls()">Продать все</button>

<button class="upg" onclick="buyMachine()">
Купить конвейер (<span id="price">100</span>)
</button>

</div>
</div>

<!-- КВЕСТЫ -->
<div id="quests" class="page">
<div class="card">
<h2>Ежедневные квесты</h2>
<div id="questBox"></div>
<p id="timer"></p>
</div>
</div>

<!-- PASS -->
<div id="pass" class="page">
<div class="card">
<h2>Season Pass</h2>

<p>Уровень: <span id="lvl">1</span></p>
<p>XP: <span id="xp">0</span>/<span id="need">20</span></p>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div id="passBox"></div>

</div>
</div>

<script>

let balls=0, coins=0, machines=0;
let price=100;

let xp=0, lvl=1, need=20;

let quests=[];

function save(){
localStorage.setItem("save",JSON.stringify({
balls,coins,machines,price,xp,lvl,need
}));
}

function load(){
let s=JSON.parse(localStorage.getItem("save"));
if(!s)return;
balls=s.balls||0;
coins=s.coins||0;
machines=s.machines||0;
price=s.price||100;
xp=s.xp||0;
lvl=s.lvl||1;
need=s.need||20;
}

function makeBall(){
balls++;
update();
}

function sellBalls(){
coins += balls*2;
balls=0;
update();
}

function buyMachine(){
if(coins>=price){
coins-=price;
machines++;
price=Math.floor(price*1.7);
}
update();
}

setInterval(()=>{ balls+=machines; update(); },1000);

function addXP(a){
xp+=a;
while(xp>=need){
xp-=need;
lvl++;
need=Math.floor(need*1.3);
}
update();
}

function update(){

document.getElementById("balls").innerText=balls;
document.getElementById("coins").innerText=coins;
document.getElementById("machines").innerText=machines;
document.getElementById("price").innerText=price;

document.getElementById("xp").innerText=xp;
document.getElementById("lvl").innerText=lvl;
document.getElementById("need").innerText=need;

document.getElementById("fill").style.width=(xp/need*100)+"%";

renderPass();
renderQuests();

save();
}

let pass=[...Array(40)].map((_,i)=>"Награда "+(i+1));

function renderPass(){
let box=document.getElementById("passBox");
box.innerHTML="";
for(let i=1;i<=40;i++){
let d=document.createElement("div");
d.className="passItem";
if(lvl>i)d.classList.add("done");
d.innerHTML=`${i} уровень — ${pass[i-1]}`;
box.appendChild(d);
}
}

function genQuests(){
quests=[
{t:"Сделай 100 шариков",g:100,r:20,type:"balls"},
{t:"Заработай 300 монет",g:300,r:25,type:"coins"},
{t:"Купи 1 конвейер",g:1,r:30,type:"machines"},
{t:"Сделай 500 шариков",g:500,r:40,type:"balls"}
];
}

function renderQuests(){
let box=document.getElementById("questBox");
box.innerHTML="";
quests.forEach(q=>{
let prog = q.type=="balls"?balls:q.type=="coins"?coins:machines;

let d=document.createElement("div");
d.className="quest";
d.innerHTML=`${q.t}<br>${prog}/${q.g}`;

if(prog>=q.g){
let b=document.createElement("button");
b.innerText="Забрать";
b.onclick=()=>{
addXP(q.r);
quests=quests.filter(x=>x!=q);
renderQuests();
};
d.appendChild(b);
}

box.appendChild(d);
});
}

function openTab(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

let next=Date.now()+86400000;

setInterval(()=>{
let t=next-Date.now();
if(t<=0){ genQuests(); next=Date.now()+86400000; }
let h=Math.floor(t/3600000);
let m=Math.floor(t/60000%60);
let s=Math.floor(t/1000%60);
document.getElementById("timer").innerText=`Новые квесты через ${h}:${m}:${s}`;
},1000);

load();
genQuests();
update();

</script>

</body>
</html>
